<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pombo Stonks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lilita+One&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="wallet">
      <div class="money-line"><span id="money">0</span><span class="cur">grana</span></div>
      <div class="pps"><span class="arrow">▲</span> <span id="pps">0</span> por segundo</div>
    </div>
    <div class="rank">
      <div class="rank-title" id="rank-title">Pombo de Praça</div>
      <div class="rank-bar"><i id="rank-fill"></i></div>
      <div class="rank-next" id="rank-next">Próxima promoção: 500</div>
    </div>
    <div class="hud-btns">
      <button class="icon-btn" id="btn-sound" type="button" aria-label="Som ligado">🔊</button>
      <button class="icon-btn" id="btn-menu" type="button" aria-label="Estatísticas e opções">📊</button>
    </div>
  </header>

  <section class="stage" id="stage-wrap" tabindex="0" role="button" aria-label="Toque no pombo para ganhar grana">
    <canvas id="stage"></canvas>
    <div class="ticker" id="ticker">
      <div class="tk-info">
        <span class="tk-label">MERCADO</span>
        <span class="tk-mult"><span id="tk-arrow">▲</span> <span id="tk-mult">x1,20</span></span>
      </div>
      <canvas id="chart"></canvas>
    </div>
    <div class="under-ticker">
      <div class="combo" id="combo" hidden></div>
      <div class="boosts" id="boosts"></div>
    </div>
    <div class="bubble" id="bubble" hidden></div>
    <div class="crash" id="crash" hidden>
      <b>SEGURA O MERCADO!</b>
      <div class="meter"><i id="crash-fill"></i></div>
      <span id="crash-txt">Toque rápido! 10s</span>
    </div>
    <button class="dica" id="dica" type="button" hidden>
      <span class="dica-ico">📲</span>
      <span class="dica-body"><b>Dica Quente do Zap</b><span class="dica-txt"></span></span>
    </button>
    <button class="dica encomenda" id="encomenda" type="button" hidden>
      <span class="dica-ico">📦</span>
      <span class="dica-body"><b>Encomenda Suspeita</b><span class="dica-txt">caixa grátis, toque rápido!</span></span>
    </button>
    <div class="stage-foot">
      <div class="tap-hint" id="tap-hint">Toque no pombo!</div>
      <button class="dip" id="dip" type="button" hidden>📉 Comprar na baixa <small>investe 25% da grana</small></button>
      <div class="position" id="position" hidden></div>
      <div class="shark" id="shark">
        <span class="shark-label" id="shark-label">🦈 Modo Tubarão</span>
        <div class="meter"><i id="shark-fill"></i></div>
      </div>
    </div>
  </section>

  <section class="shop">
    <div class="shop-head">
      <div class="tabs" role="tablist" aria-label="Seções">
        <button type="button" class="tab" role="tab" data-tab="biz" id="tab-biz">Negócios</button>
        <button type="button" class="tab" role="tab" data-tab="boxes" id="tab-boxes">Caixas<span class="dot" hidden></span></button>
        <button type="button" class="tab" role="tab" data-tab="items" id="tab-items">Itens<span class="dot" hidden></span></button>
      </div>
      <div class="seg" role="group" aria-label="Quantidade por compra">
        <button type="button" data-m="1" id="m-1">x1</button>
        <button type="button" data-m="10" id="m-10">x10</button>
        <button type="button" data-m="100" id="m-100">x100</button>
        <button type="button" data-m="max" id="m-max">MÁX</button>
      </div>
    </div>
    <div id="biz" class="pane"></div>
    <div id="boxes" class="pane" hidden></div>
    <div id="items" class="pane" hidden></div>
  </section>
</div>

<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="opener" hidden>
  <div class="op-rays"></div>
  <div class="op-center">
    <button class="op-box" id="op-box" type="button" aria-label="Abrir caixa">
      <span class="lid"></span><span class="body"><span class="lbl"></span></span>
    </button>
    <div class="op-hint" id="op-hint">Toque na caixa para abrir!</div>
    <div class="op-cards" id="op-cards"></div>
    <div class="op-actions" id="op-actions"></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<div id="modal" hidden>
  <div class="m-card" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h3 id="m-title"></h3>
    <div id="m-body"></div>
    <div id="m-actions"></div>
  </div>
</div>

<script src="src/data.js"></script>
<script src="src/format.js"></script>
<script src="src/audio.js"></script>
<script src="src/save.js"></script>
<script src="src/items.js"></script>
<script src="src/game.js"></script>
<script src="src/fx.js"></script>
<script src="src/market.js"></script>
<script src="src/events.js"></script>
<script src="src/loot.js"></script>
<script src="src/pombo.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
