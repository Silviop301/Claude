# Publica o jogo (pasta craque/) no climbix.app (Hostinger) por SSH a cada atualização.
# Acesso (Settings > Secrets and variables > Actions), um dos dois:
#  - CLIMBIX_KEY (ou CLIMBIX_SSH_KEY): chave PRIVADA cuja chave pública está cadastrada na Hostinger (Acesso SSH), ou
#  - CLIMBIX_SSH_PASSWORD: a senha SSH da Hostinger.
# Sem nenhum dos dois, o workflow só avisa e não faz nada.
name: Publicar no climbix.app

on:
  push:
    branches: [claude/gracious-darwin-9gdlfp, main]
    paths: ['craque/**', '.github/workflows/deploy-climbix.yml']
  workflow_dispatch:
    inputs:
      presente_conta:
        description: 'Moedas de presente (teste): usuário ou e-mail da conta. Vazio = só publica.'
        required: false
        default: ''
      presente_moedas:
        description: 'Quantas moedas (1 a 5000)'
        required: false
        default: '500'

concurrency:
  group: deploy-climbix
  cancel-in-progress: false

env:
  SSH_HOST: 147.93.39.106
  SSH_PORT: '65002'
  SSH_USER: u717677135
  # Pasta pública do domínio na Hostinger (hospedagem compartilhada)
  TARGET: domains/climbix.app/public_html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar chave SSH
        id: key
        env:
          KEY: ${{ secrets.CLIMBIX_KEY || secrets.CLIMBIX_SSH_KEY }}
          SSHPASS: ${{ secrets.CLIMBIX_SSH_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSHPASS" ]; then
            # Acesso por senha (tem prioridade quando configurada)
            sudo apt-get install -y -qq sshpass >/dev/null
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo "ssh=sshpass -e ssh -p $SSH_PORT" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$KEY" ]; then
            echo "::warning::Nenhum acesso configurado (CLIMBIX_SSH_KEY ou CLIMBIX_SSH_PASSWORD): nada foi publicado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tolera chave colada com quebras de linha do Windows ou numa linha só
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          if [ "$(wc -l < ~/.ssh/id_deploy)" -le 1 ] && grep -q 'BEGIN' ~/.ssh/id_deploy; then
            python3 - <<'PY'
          import os, re
          p = os.path.expanduser('~/.ssh/id_deploy'); s = open(p).read().strip()
          m = re.match(r'(-----BEGIN [A-Z ]+-----)\s*(.*?)\s*(-----END [A-Z ]+-----)', s, re.S)
          if not m:
              print('::error::A chave está incompleta: tem "BEGIN" mas não termina com a linha "-----END ... PRIVATE KEY-----". Copie o arquivo inteiro de novo (%d caracteres colados).' % len(s))
              raise SystemExit(1)
          body = re.sub(r'\s+', '', m.group(2))
          open(p, 'w').write(m.group(1) + '\n' + '\n'.join(body[i:i + 70] for i in range(0, len(body), 70)) + '\n' + m.group(3) + '\n')
          PY
          fi
          chmod 600 ~/.ssh/id_deploy
          # Diagnóstico sem mostrar a chave
          echo "Primeira linha: $(head -1 ~/.ssh/id_deploy | cut -c1-40) · linhas: $(wc -l < ~/.ssh/id_deploy)"
          if head -1 ~/.ssh/id_deploy | grep -q '^ssh-'; then
            echo "::error::O segredo tem a chave PÚBLICA (ssh-...). Cole a chave PRIVADA (arquivo sem .pub, começa com -----BEGIN)."; exit 1
          fi
          ssh-keygen -y -f ~/.ssh/id_deploy > /tmp/pub.txt || { echo "::error::A chave privada não pôde ser lida (formato inválido ou com senha)."; exit 1; }
          echo "Chave pública correspondente: $(cut -d' ' -f1,3 /tmp/pub.txt) $(cut -d' ' -f2 /tmp/pub.txt | cut -c1-24)..."
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "ssh=ssh -p $SSH_PORT -i $HOME/.ssh/id_deploy" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Conferir a pasta do site
        if: steps.key.outputs.ok == 'true'
        env:
          SSHPASS: ${{ secrets.CLIMBIX_SSH_PASSWORD }}
          SSH: ${{ steps.key.outputs.ssh }}
        run: |
          $SSH "$SSH_USER@$SSH_HOST" "ls -d $TARGET" || {
            echo "::error::Não entrou no servidor ou a pasta $TARGET não existe. Pastas disponíveis:";
            $SSH "$SSH_USER@$SSH_HOST" "ls domains";
            exit 1; }

      - name: Enviar o jogo
        if: steps.key.outputs.ok == 'true'
        env:
          SSHPASS: ${{ secrets.CLIMBIX_SSH_PASSWORD }}
          SSH: ${{ steps.key.outputs.ssh }}
        run: |
          # Versão nova nas URLs de js/css e do service worker (o CDN guarda arquivos por dias)
          python3 tools/craque_sw.py
          # Primeiro os arquivos novos (código, imagens), depois a página e o service worker: assim a página
          # nova nunca aponta para um arquivo que ainda não chegou (o cache da Hostinger guardaria o 404)
          rsync -az --exclude '.htaccess' --exclude '.well-known' --exclude '/index.html' --exclude '/sw.js' \
            -e "$SSH" \
            craque/ "$SSH_USER@$SSH_HOST:$TARGET/"
          rsync -az --delete --exclude '.htaccess' --exclude '.well-known' \
            -e "$SSH" \
            craque/ "$SSH_USER@$SSH_HOST:$TARGET/"
          echo "Publicado em https://climbix.app"

      # Entrar com Google, GitHub e Discord (passo a passo em docs/climbix-login.md). Segredos, em pares:
      #   CLIMBIX_GOOGLE_ID / CLIMBIX_GOOGLE_SECRET, CLIMBIX_GITHUB_ID / CLIMBIX_GITHUB_SECRET, CLIMBIX_DISCORD_ID / CLIMBIX_DISCORD_SECRET
      # Grava climbix-data/oauth.json FORA do public_html (o rsync acima não apaga). Sem nenhum par, não mexe no arquivo.
      - name: Chaves do login com Google, GitHub e Discord
        if: steps.key.outputs.ok == 'true'
        env:
          SSHPASS: ${{ secrets.CLIMBIX_SSH_PASSWORD }}
          SSH: ${{ steps.key.outputs.ssh }}
          OAUTH_GOOGLE_ID: ${{ secrets.CLIMBIX_GOOGLE_ID }}
          OAUTH_GOOGLE_SECRET: ${{ secrets.CLIMBIX_GOOGLE_SECRET }}
          OAUTH_GITHUB_ID: ${{ secrets.CLIMBIX_GITHUB_ID }}
          OAUTH_GITHUB_SECRET: ${{ secrets.CLIMBIX_GITHUB_SECRET }}
          OAUTH_DISCORD_ID: ${{ secrets.CLIMBIX_DISCORD_ID }}
          OAUTH_DISCORD_SECRET: ${{ secrets.CLIMBIX_DISCORD_SECRET }}
        run: |
          python3 - > "$RUNNER_TEMP/oauth.json" <<'PY'
          import json, os
          c = {}
          for p in ('google', 'github', 'discord'):
              i, s = os.environ.get('OAUTH_%s_ID' % p.upper(), '').strip(), os.environ.get('OAUTH_%s_SECRET' % p.upper(), '').strip()
              if i and s:
                  c[p] = {'id': i, 'secret': s}
          if c:
              print(json.dumps(c))
          PY
          if [ ! -s "$RUNNER_TEMP/oauth.json" ]; then
            echo "Nenhum serviço de login nos segredos: oauth.json do servidor fica como está."; exit 0
          fi
          DATA="$(dirname "$TARGET")/climbix-data"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p $DATA && umask 077 && cat > $DATA/oauth.json" < "$RUNNER_TEMP/oauth.json"
          rm -f "$RUNNER_TEMP/oauth.json"
          echo "Login ligado para: $(python3 -c "import os; print(', '.join(p for p in ('google', 'github', 'discord') if os.environ.get('OAUTH_%s_ID' % p.upper()) and os.environ.get('OAUTH_%s_SECRET' % p.upper())))")"

      # Senha para ler as opiniões dos jogadores em climbix.app/respostas.html (segredo CLIMBIX_FEEDBACK_SENHA,
      # escolhido por você, com 8 caracteres ou mais). Grava climbix-data/feedback-senha FORA do public_html.
      # Sem o segredo, não mexe no arquivo (e sem arquivo ninguém lê as respostas).
      - name: Senha das opiniões
        if: steps.key.outputs.ok == 'true'
        env:
          SSHPASS: ${{ secrets.CLIMBIX_SSH_PASSWORD }}
          SSH: ${{ steps.key.outputs.ssh }}
          FB_SENHA: ${{ secrets.CLIMBIX_FEEDBACK_SENHA }}
        run: |
          if [ "${#FB_SENHA}" -lt 8 ]; then
            echo "Sem CLIMBIX_FEEDBACK_SENHA (ou com menos de 8 caracteres): leitura das opiniões fica como está."; exit 0
          fi
          DATA="$(dirname "$TARGET")/climbix-data"
          printf '%s' "$FB_SENHA" | $SSH "$SSH_USER@$SSH_HOST" "mkdir -p $DATA && umask 077 && cat > $DATA/feedback-senha"
          echo "Leitura das opiniões ligada em https://climbix.app/respostas.html"

      # Compra de moedas (Mercado Pago, api/pay.php): segredo CLIMBIX_MP_TOKEN = Access Token da aplicação no
      # Mercado Pago Developers (o de teste não cobra; no painel novo ele também começa com APP_USR-). Grava climbix-data/mp-token FORA do public_html.
      # Sem o segredo, não mexe no arquivo (e sem arquivo a loja mostra "Compra em breve").
      - name: Token do Mercado Pago
        if: steps.key.outputs.ok == 'true'
        env:
          SSHPASS: ${{ secrets.CLIMBIX_SSH_PASSWORD }}
          SSH: ${{ steps.key.outputs.ssh }}
          MP_TOKEN: ${{ secrets.CLIMBIX_MP_TOKEN }}
        run: |
          if [ "${#MP_TOKEN}" -lt 20 ]; then
            echo "Sem CLIMBIX_MP_TOKEN: compra de moedas fica como está."; exit 0
          fi
          DATA="$(dirname "$TARGET")/climbix-data"
          printf '%s' "$MP_TOKEN" | $SSH "$SSH_USER@$SSH_HOST" "mkdir -p $DATA && umask 077 && cat > $DATA/mp-token"
          case "$MP_TOKEN" in TEST-*) echo "Compra de moedas ligada no modo de TESTE (não cobra).";; *) echo "Compra de moedas ligada (produção).";; esac

      # Presente de moedas (api/pay.php?a=gift): segredo CLIMBIX_ADMIN_KEY (frase longa) grava climbix-data/admin-key FORA do
      # public_html. Rodar o workflow à mão com "presente_conta" manda as moedas para essa conta (chegam ao abrir o jogo logado).
      - name: Presente de moedas
        if: steps.key.outputs.ok == 'true'
        env:
          SSHPASS: ${{ secrets.CLIMBIX_SSH_PASSWORD }}
          SSH: ${{ steps.key.outputs.ssh }}
          ADMIN_KEY: ${{ secrets.CLIMBIX_ADMIN_KEY }}
          CONTA: ${{ github.event.inputs.presente_conta }}
          MOEDAS: ${{ github.event.inputs.presente_moedas }}
        run: |
          if [ "${#ADMIN_KEY}" -lt 12 ]; then
            echo "Sem CLIMBIX_ADMIN_KEY: presente de moedas desligado."; exit 0
          fi
          DATA="$(dirname "$TARGET")/climbix-data"
          printf '%s' "$ADMIN_KEY" | $SSH "$SSH_USER@$SSH_HOST" "mkdir -p $DATA && umask 077 && cat > $DATA/admin-key"
          if [ -n "$CONTA" ]; then
            BODY=$(jq -nc --arg k "$ADMIN_KEY" --arg u "$CONTA" --argjson n "${MOEDAS:-500}" '{key:$k,user:$u,coins:$n}')
            R=$(curl -sS -m 30 -X POST -H 'Content-Type: application/json' --data "$BODY" "https://climbix.app/api/pay.php?a=gift")
            echo "Presente: $R"
            echo "$R" | grep -q '"ok":true' || { echo "::error::Presente não entregue: $R"; exit 1; }
          fi

      # Opiniões por e-mail: cada opinião nova já vai sozinha (api/feedback.php). Aqui manda o que ficou para trás
      # (na primeira vez, tudo o que já existia, numa leva só). Falha aqui não derruba o deploy.
      - name: Opiniões por e-mail
        if: steps.key.outputs.ok == 'true'
        run: |
          curl -sS -m 60 -X POST "https://climbix.app/api/feedback.php?a=mail" || echo "::warning::Não deu para chamar o envio das opiniões."

      # Contador de acessos por e-mail (api/stats.php?a=mail): o cron da Hostinger chama de hora em hora e o PHP só manda
      # um por dia, a partir das 18h de Brasília (o primeiro de todos sai na hora). Aqui instala a linha do cron (sem
      # duplicar) e chama uma vez. Falha aqui não derruba o deploy: o primeiro acesso depois das 18h também dispara.
      - name: Contador por e-mail
        if: steps.key.outputs.ok == 'true'
        env:
          SSHPASS: ${{ secrets.CLIMBIX_SSH_PASSWORD }}
          SSH: ${{ steps.key.outputs.ssh }}
        run: |
          LINE='7 * * * * curl -sS -m 60 "https://climbix.app/api/stats.php?a=mail" >/dev/null 2>&1 # climbix-contador'
          $SSH "$SSH_USER@$SSH_HOST" "(crontab -l 2>/dev/null | grep -v climbix-contador; echo '$LINE') | crontab - && crontab -l | grep climbix-contador" \
            || echo "::warning::Não deu para instalar o cron do contador (o primeiro acesso depois das 18h ainda manda)."
          curl -sS -m 60 "https://climbix.app/api/stats.php?a=mail" || echo "::warning::Não deu para chamar o contador."
